<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HealthBridge Pharmacy | Your Health. Our Priority.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--alt:#F6FAF7;--ink:#0F1F18;--mut:#5B6B63;--line:#E3EDE7;--card:#fff;--g1:#052E1C;--g2:#0B7A4B;--g3:#22C55E;--acc:#059669;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120d;--alt:#0c1b14;--ink:#EAF5EF;--mut:#97ABA1;--line:#1c3027;--card:#0f2118;--acc:#34D399;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07120d;--alt:#0c1b14;--ink:#EAF5EF;--mut:#97ABA1;--line:#1c3027;--card:#0f2118;--acc:#34D399;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,92%);margin:auto}
header{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;transition:transform .4s}
header.hide{transform:translateY(-140%)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 20px;border-radius:999px;width:min(1180px,92%);margin:auto;transition:.4s;color:#fff}
header.solid .nav{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--ink);box-shadow:0 8px 30px rgba(5,46,28,.08)}
.logo{font-weight:800;font-size:1.25rem}.logo b{color:var(--g3)}
.links{display:flex;gap:22px;font-size:.9rem;font-weight:500}
.links a{opacity:.85;position:relative}.links a.on,.links a:hover{opacity:1}
.links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--g3);border-radius:2px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:7px 7px 7px 20px;border-radius:999px;background:#fff;color:#052E1C;font-weight:700;font-size:.85rem;border:0;cursor:pointer;transition:transform .3s}
.pill i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--g3);color:#fff;font-style:normal;transition:transform .35s}
.pill:hover{transform:translateY(-2px)}.pill:hover i{transform:rotate(-45deg)}
.pill.dk{background:var(--g1);color:#fff}
.burger{display:none;background:none;border:0;color:inherit;font-size:1.5rem;cursor:pointer}
main{min-height:100vh}
.page{display:none;padding-top:calc(90px + env(safe-area-inset-top,0px))}.page.on{display:block;animation:pg .6s cubic-bezier(.2,.7,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:40px;margin:-78px auto 0;width:min(1240px,96%);min-height:640px;padding:150px 5% 60px;color:#fff;background:radial-gradient(60% 70% at 78% 40%,#22C55E 0%,#0B7A4B 45%,#052E1C 100%)}
.hero.sm{min-height:380px;padding-bottom:50px}
.hero h1{font-size:clamp(2.6rem,7vw,5.6rem);line-height:1.02;letter-spacing:-.035em;margin:.3em 0;max-width:720px}
.hero h1 span,.ln span{display:inline-block;animation:up .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.ln{display:block;overflow:hidden}.ln:nth-child(2) span{animation-delay:.12s}.ln:nth-child(3) span{animation-delay:.24s}
.eyebrow{color:var(--acc);font-weight:700;font-size:.9rem}.hero .eyebrow{color:#bbf7d0}
.hero p.sub{max-width:520px;opacity:.88}
.side{position:absolute;right:5%;bottom:130px;max-width:300px;text-align:left}
.side b{font-size:1.25rem;display:block;margin-bottom:6px}
.orb{position:absolute;right:4%;top:60px;width:min(46vw,520px);aspect-ratio:1;opacity:.9;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-18px) rotate(3deg)}}
.glass{position:absolute;padding:12px 18px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);font-size:.82rem;font-weight:600;animation:fl 6s ease-in-out infinite}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:70px;font-size:.9rem}
.nums em{color:var(--g3);font-style:normal;display:block;font-size:.8rem}
section.s{padding:90px 0}.alt{background:var(--alt)}
h2{font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.08;letter-spacing:-.03em;margin:.2em 0 .4em}
.lead{color:var(--mut);max-width:620px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;transition:transform .4s,box-shadow .4s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(5,46,28,.12)}
.card h3{margin:.3em 0;font-size:1.2rem}.card p{color:var(--mut);margin:.3em 0 1em;font-size:.95rem}
.num{color:var(--acc);font-weight:800;font-size:.85rem}.num::before{content:"#"}
.link{font-weight:700;color:var(--acc);font-size:.9rem;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.marq{overflow:hidden;margin:34px 0;border-block:1px solid var(--line);padding:18px 0}
.marq div{display:flex;gap:56px;width:max-content;animation:mq 26s linear infinite;font-weight:700;color:var(--mut)}
.marq span::before{content:"✚ ";color:var(--g3)}
@keyframes mq{to{transform:translateX(-50%)}}
.steps{counter-reset:s;position:relative;margin-top:40px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{counter-increment:s;padding:26px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.step::before{content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;font-weight:800;margin-bottom:14px}
.cta{border-radius:40px;margin:0 auto;width:min(1240px,96%);padding:70px 6%;color:#fff;background:radial-gradient(70% 90% at 85% 20%,#22C55E 0%,#0B7A4B 40%,#052E1C 100%)}
.cta h2{max-width:620px}.cta p{max-width:520px;opacity:.9}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}
.chip{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;font-weight:600;font-size:.85rem;transition:.25s}
.chip.on,.chip:hover{background:var(--g2);color:#fff;border-color:var(--g2)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--alt);color:var(--acc);border:1px solid var(--line)}
.badge.rx{background:#fff1f0;color:#b42318;border-color:#fecdca}
.img{height:150px;border-radius:20px;margin-bottom:16px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);display:grid;place-items:center;font-size:2.4rem;color:var(--g2);transition:transform .5s}
.card:hover .img{transform:scale(1.04)}
.note{font-size:.85rem;color:var(--mut);border-left:3px solid var(--g3);padding:6px 14px;margin-top:26px}
form{display:grid;gap:14px;margin-top:20px}
input,select,textarea{width:100%;padding:14px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
footer{margin:80px auto 20px;width:min(1240px,96%);border-radius:40px;background:var(--g1);color:#d6e8de;padding:56px 6% 28px}
footer .cols{display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{color:#fff;margin:0 0 10px}footer a{display:block;opacity:.8;padding:2px 0;cursor:pointer}footer small{display:block;margin-top:30px;opacity:.6}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:1.6rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}100%{box-shadow:0 0 0 22px rgba(37,211,102,0)}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
dialog{border:0;border-radius:28px;padding:30px;max-width:520px;width:92%;background:var(--card);color:var(--ink)}dialog::backdrop{background:rgba(5,46,28,.55);backdrop-filter:blur(4px)}
@media(max-width:860px){.links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--bg);color:var(--ink);padding:20px;border-radius:24px;border:1px solid var(--line)}.links.open{display:flex}.burger{display:block}.nav>.pill{display:none}.side,.orb{display:none}.nums{grid-template-columns:1fr 1fr}.hero{border-radius:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header id="hd"><div class="nav"><a class="logo" href="#home">Health<b>Bridge</b></a><button class="burger" id="bg" aria-label="Menu">☰</button><nav class="links" id="lk"></nav><a class="pill" href="#contact">Speak to a Pharmacist <i>→</i></a></div></header>
<main id="m"></main>
<a class="wa" href="https://wa.me/2348000000000" aria-label="WhatsApp">✆</a>
<dialog id="dg"></dialog>
<script>
const WA="https://wa.me/2348000000000?text=";
const NAV=[["home","Home"],["about","About"],["services","Services"],["shop","Shop"],["resources","Health Resources"],["contact","Contact"]];
const SV=[["Prescription Dispensing","Access prescribed medicines with appropriate prescription checks, professional dispensing, and clear instructions on how to use your medication safely.","Learn More"],["Over-the-Counter Medicines","Explore eligible non-prescription medicines for common health concerns, with professional guidance when needed.","Explore Medicines"],["Vitamins and Supplements","Find selected vitamins, minerals, and supplements with guidance on appropriate use and possible interactions.","Explore Supplements"],["Personal Care and Skincare","Shop selected skincare, hygiene, baby-care, and personal wellness essentials.","Shop Personal Care"],["Medication Counselling","Get help understanding your medicine instructions, precautions, possible side effects, and other important information.","Speak to Our Team"],["Health Screening","Enquire about available screening services, such as blood pressure or blood glucose checks, where offered.","View Services"]];
const CAT=[["Prescription Medicines","℞",1],["Over-the-Counter Medicines","✚",0],["Vitamins and Supplements","❀",0],["Skincare and Personal Care","❍",0],["Baby and Mother Care","♡",0],["First Aid and Medical Supplies","⛨",0],["Medical Devices","◔",0]];
const ART=[["How to Use Medicines Safely","Medicine Safety"],["Understanding Your Blood Pressure","Everyday Health"],["Why You Should Avoid Sharing Prescription Medicines","Medicine Safety"],["Safe Storage of Medicines at Home","Family Health"],["Why Antibiotics Should Be Used Responsibly","Antibiotic Awareness"],["Understanding Medicine Labels","Medicine Safety"],["When to Speak to a Pharmacist","Everyday Health"],["Understanding Antimicrobial Resistance","Antibiotic Awareness"]];
const btn=(t,h,c="")=>`<a class="pill ${c}" href="${h}">${t} <i>→</i></a>`;
const hero=(eb,h,sub,ctas,sm)=>`<div class="hero ${sm?"sm":""}"><svg class="orb" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="rgba(255,255,255,.07)"/><circle cx="100" cy="100" r="64" fill="rgba(255,255,255,.08)"/><path d="M82 40h36v42h42v36h-42v42H82v-42H40V82h42z" fill="rgba(255,255,255,.9)"/></svg>${sm?"":'<div class="glass" style="right:34%;top:120px">Prescription checks</div><div class="glass" style="right:8%;top:300px;animation-delay:1s">Pharmacist guidance</div>'}<div class="eyebrow">${eb}</div><h1>${h.split("|").map(x=>`<span class="ln"><span>${x}</span></span>`).join("")}</h1><p class="sub">${sub}</p><div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">${ctas}</div>${sm?"":'<div class="side"><b>Professional care.</b><span style="opacity:.85">Reliable guidance. A healthier community.</span></div><div class="nums"><div><em>#01</em>Prescription Dispensing</div><div><em>#02</em>OTC Medicines</div><div><em>#03</em>Medication Counselling</div><div><em>#04</em>Health Screening</div></div>'}</div>`;
const svc=()=>SV.map((s,i)=>`<div class="card rv"><div class="num">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p><a class="link" href="#${i==3?"shop":i==5?"services":"contact"}">${s[2]} →</a></div>`).join("");
const cta=`<div class="cta rv" style="margin-top:60px"><div class="eyebrow" style="color:#bbf7d0">Get in touch</div><h2>Your Health Questions Matter.</h2><p>Whether you need help finding a product or understanding your medicines, our pharmacy team is available to assist with appropriate enquiries.</p><br>${btn("Contact HealthBridge Pharmacy","#contact")}</div>`;
const P={
home:()=>hero("Hey, welcome to HealthBridge","Your Trusted|Partner for Better|Health and Wellness.","From prescription medicines to everyday healthcare essentials, HealthBridge Pharmacy makes it easier to access pharmaceutical care, trusted health information, and products for your family’s well-being.",btn("Shop Products","#shop")+btn("Speak to a Pharmacist","#contact","dk"))+
`<div class="wrap"><div class="marq"><div>${"<span>Quality-conscious medicine sourcing</span><span>Professional pharmaceutical guidance</span><span>Convenient product enquiries</span><span>Patient-centred service</span>".repeat(4)}</div></div>
<section class="s"><div class="eyebrow rv">Our Pharmacy Services</div><h2 class="rv">Smart Care.<br>Real Guidance.<br>Healthier Families.</h2><div class="grid">${svc()}</div></section></div>
<div class="alt"><div class="wrap"><section class="s"><div class="eyebrow">Why Choose HealthBridge Pharmacy?</div><h2 class="rv">Care That Puts You First</h2><div class="grid">${[["Care That Puts You First","We aim to make every interaction respectful, informative, and focused on your needs."],["Guidance You Can Understand","Our pharmacy team helps explain medicine instructions and encourages responsible medicine use."],["Convenience for Everyday Needs","Enquire about products, confirm availability, and explore suitable collection or delivery options."],["A Commitment to Responsible Care","We encourage appropriate medicine use, protect customer confidentiality, and recognise when further medical attention is needed."]].map(x=>`<div class="card rv"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("")}</div></section></div></div>
<div class="wrap"><section class="s"><div class="eyebrow">How It Works</div><h2 class="rv">Four simple steps.</h2><div class="steps">${[["Explore Your Needs","Browse available healthcare products or contact us about a medicine or pharmacy service."],["Get Professional Guidance","Ask questions about product availability, medicine use, and relevant purchasing requirements."],["Confirm Your Order","Confirm the product, price, availability, and any prescription requirements."],["Collect or Receive Your Order","Use an available collection or delivery option, subject to location and applicable requirements."]].map(x=>`<div class="step rv"><h3>${x[0]}</h3><p style="color:var(--mut)">${x[1]}</p></div>`).join("")}</div></section>
<section class="s" style="padding-top:20px"><div class="eyebrow">Featured Product Categories</div><h2 class="rv">Everything for everyday health.</h2><div class="grid">${CAT.slice(0,6).map(c=>`<a class="card rv" href="#shop"><div class="img">${c[1]}</div><h3>${c[0]}</h3></a>`).join("")}</div></section>
<section class="s" style="padding-top:20px"><div class="eyebrow">Health Tips and Resources</div><h2 class="rv">Learn. Stay safe.</h2><div class="grid">${ART.slice(0,4).map(a=>`<a class="card rv" href="#resources"><span class="badge">${a[1]}</span><h3>${a[0]}</h3><span class="link">Read more →</span></a>`).join("")}</div></section></div>${cta}
<div class="wrap"><section class="s"><div class="eyebrow">Visit Us</div><h2>Find HealthBridge.</h2><p class="lead">[Insert Verified Street Address], Umuahia, Abia State, Nigeria.<br>Phone: [Insert Business Phone Number] · Opening Hours: [Insert Actual Opening Hours]</p><br>${btn("Get Directions","#contact")}</section></div>`,
about:()=>hero("About HealthBridge Pharmacy","Healthcare|Built Around|You","Reliable medicines and professional pharmaceutical guidance should be convenient, respectful, and centred on the individual.","",1)+
`<div class="wrap"><section class="s"><div class="eyebrow">Our Story</div><h2 class="rv">A community-focused pharmacy.</h2><p class="lead">HealthBridge Pharmacy was envisioned as a community-focused pharmacy serving people in Umuahia and surrounding communities. We aim to make everyday healthcare more approachable by helping customers find available healthcare products, understand their medicines, and seek appropriate professional guidance when they need it.</p>
<div class="grid"><div class="card rv"><div class="num">Mission</div><p style="color:var(--ink);font-size:1.1rem">To provide dependable pharmaceutical services, responsible medicine guidance, and accessible healthcare essentials that support healthier communities.</p></div><div class="card rv"><div class="num">Vision</div><p style="color:var(--ink);font-size:1.1rem">To become a trusted pharmacy destination recognised for professional excellence, integrity, convenience, and patient-centred care.</p></div></div></section>
<section class="s" style="padding-top:0"><div class="eyebrow">Our Core Values</div><div class="grid">${[["Integrity","We communicate honestly and act responsibly."],["Patient Safety","We encourage safe and appropriate medicine use."],["Professionalism","We uphold applicable pharmacy standards and ethical responsibilities."],["Compassion","We treat every customer with dignity, respect, and empathy."],["Excellence","We continually seek to improve our services and customer experience."],["Confidentiality","We handle customer and health information responsibly."]].map((v,i)=>`<div class="card rv"><div class="num">0${i+1}</div><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join("")}</div></section>
<section class="s" style="padding-top:0"><div class="eyebrow">Our Pharmacy Team</div><p class="lead">Our team section will feature verified staff members and their actual qualifications: full name, professional title, verified qualifications, experience, areas of interest, and a professional photograph.</p><div class="grid">${[1,2,3].map(()=>`<div class="card rv"><div class="img">☺</div><h3>[Verified Name]</h3><p>[Professional Title and Qualifications]</p></div>`).join("")}</div></section></div>${cta}`,
services:()=>hero("Pharmacy Services","Professional Care|for Everyday|Health Needs","HealthBridge Pharmacy aims to support customers through responsible dispensing, medicine information, and accessible pharmacy services.",btn("Ask a Pharmacist","#contact"),1)+
`<div class="wrap"><section class="s"><div class="note" style="margin-top:0">The services listed below should be displayed only when the pharmacy is equipped and authorised to provide them.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${[["Prescription Dispensing","We dispense medicines in accordance with applicable prescription requirements and professional standards: reviewing the prescription, confirming strength and quantity, checking for interactions, and explaining how the medicine should be used.","Make a Prescription Enquiry"],["Over-the-Counter Medicines","Eligible non-prescription products for common health concerns, subject to stock availability.","Browse Non-Prescription Products"],["Medication Counselling","Correct administration and timing, storage, common side effects and warning signs, missed-dose guidance, and potential interactions.","Ask a Pharmacist"],["Medication Review","Where available and appropriate, our pharmacist may review medicines to identify duplication, interactions, and medicine-use difficulties.","Enquire About a Medication Review"],["Blood Pressure Screening","If offered, blood pressure checks can help you understand your readings. Screening results do not replace medical diagnosis.","Enquire About Blood Pressure Checks"],["Blood Glucose Screening","If offered, screening gives your measured glucose level at the time of testing, with follow-up advice where indicated.","Enquire About Glucose Screening"],["Vitamins and Supplements","Information about selected vitamins, minerals, and supplements, appropriate use, and possible interactions.","Explore Supplements"],["Family and Personal Care","Selected products for everyday hygiene, skincare, baby care, and family wellness.","Shop Personal Care"],["Product Availability Enquiries","Confirm whether a medicine or product is available before visiting. Provide the name, strength, dosage form, and pack size where known.","Check Product Availability"],["Collection and Delivery","Where available, arrange collection or delivery of eligible products, subject to stock, location, payment terms, prescription requirements, and applicable laws.","Ask About Delivery"]].map((s,i)=>`<div class="card rv"><div class="num">${String(i+1).padStart(2,"0")}</div><h3>${s[0]}</h3><p>${s[1]}</p><a class="link" href="${WA}${encodeURIComponent("Hello HealthBridge, I would like to: "+s[2])}">${s[2]} →</a></div>`).join("")}</div></section></div>${cta}`,
shop:()=>hero("Shop Healthcare Products","Everyday Health|Essentials, All|in One Place","Explore available medicines and healthcare products. Use the categories below or contact the pharmacy to confirm stock availability.","",1)+
`<div class="wrap"><section class="s"><div class="chips" id="ch"><button class="chip on" data-c="all">All</button>${CAT.map(c=>`<button class="chip" data-c="${c[0]}">${c[0]}</button>`).join("")}</div><input id="q" placeholder="Search categories" aria-label="Search"><div class="grid" id="pg"></div><div class="note">Online listings are subject to availability and should be updated regularly. Prescription-only medicines and other regulated products require the applicable checks and controls.</div>
<h2 style="margin-top:70px">How to Order</h2><div class="steps">${["Browse the products.","Select a product to view its details.","Confirm stock availability and price.","Provide a valid prescription where required.","Confirm payment and fulfilment arrangements.","Receive an order confirmation if the pharmacy accepts the order."].map(s=>`<div class="step rv"><p style="margin:0">${s}</p></div>`).join("")}</div></section></div>`,
resources:()=>hero("Health Resources and Pharmacy Advice","Make Informed|Decisions About|Your Health","Practical educational content about medicine safety, everyday wellness, and responsible self-care.","",1)+
`<div class="wrap"><section class="s"><div class="chips" id="rc">${["All","Medicine Safety","Everyday Health","Family Health","Antibiotic Awareness"].map((c,i)=>`<button class="chip ${i?"":"on"}" data-c="${c}">${c}</button>`).join("")}</div><div class="grid" id="ag"></div><div class="note">All health content should be checked for accuracy and reviewed by an appropriately qualified healthcare professional before publication. Articles are for general educational purposes and do not replace personalised medical advice, diagnosis, or treatment.</div></section></div>`,
contact:()=>hero("Contact HealthBridge Pharmacy","Your Health|Questions|Matter","Ask about a product, a service, or availability. Our team will help with appropriate enquiries.","",1)+
`<div class="wrap"><section class="s"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Send an enquiry</h3><form id="cf"><input name="n" placeholder="Your name" required><input name="p" placeholder="Phone number" required><select name="t"><option>Product availability</option><option>Prescription enquiry</option><option>Medication counselling</option><option>Collection or delivery</option></select><textarea name="m" rows="4" placeholder="Your message"></textarea><button class="pill dk" style="justify-content:space-between">Send via WhatsApp <i>→</i></button></form></div><div class="card"><h3>Visit us</h3><p>[Insert Verified Street Address], Umuahia, Abia State, Nigeria.</p><p>Phone: +234 800 000 0000 (placeholder)<br>Email: hello@healthbridgepharmacy.example (placeholder)<br>Hours: [Insert Actual Opening Hours]</p><div class="img" style="height:170px">⌖</div></div></div></section></div>`
};
const $=s=>document.querySelector(s),m=$("#m"),hd=$("#hd");
$("#lk").innerHTML=NAV.map(n=>`<a href="#${n[0]}" data-p="${n[0]}">${n[1]}</a>`).join("");
$("#bg").onclick=()=>$("#lk").classList.toggle("open");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
function shop(){const f=$("#ch .on").dataset.c,q=$("#q").value.toLowerCase();$("#pg").innerHTML=CAT.filter(c=>(f=="all"||c[0]==f)&&c[0].toLowerCase().includes(q)).map(c=>`<div class="card in"><div class="img">${c[1]}</div><span class="badge ${c[2]?"rx":""}">${c[2]?"Prescription Required":"Non-Prescription"}</span><h3>${c[0]}</h3><p>Availability: Contact to Confirm<br>Price: Contact to Confirm</p><button class="link" data-d="${c[0]}" data-r="${c[2]}">View Details →</button></div>`).join("")||"<p>No matches.</p>"}
function arts(){const f=$("#rc .on").dataset.c;$("#ag").innerHTML=ART.filter(a=>f=="All"||a[1]==f).map(a=>`<div class="card in"><span class="badge">${a[1]}</span><h3>${a[0]}</h3><p>Reviewed by: [Qualified Reviewer]</p><button class="link" data-a="${a[0]}">Read more →</button></div>`).join("")}
function route(){let p=(location.hash||"#home").slice(1);if(!P[p])p="home";m.innerHTML=`<div class="page on">${P[p]()}</div><footer><div class="cols"><div><div class="logo" style="color:#fff">Health<b>Bridge</b></div><p>Your Health. Our Priority.</p></div><div><h4>Explore</h4>${NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("")}</div><div><h4>Contact</h4><a>+234 800 000 0000 (placeholder)</a><a>Umuahia, Abia State, Nigeria</a></div></div><small>This is a template: all contact details, staff profiles, services, and prices must be verified before publication. Content is general information and does not replace personalised medical advice.</small></footer>`;
document.querySelectorAll(".links a").forEach(a=>a.classList.toggle("on",a.dataset.p==p));$("#lk").classList.remove("open");scrollTo(0,0);document.querySelectorAll(".rv").forEach(e=>io.observe(e));
if(p=="shop"){shop();$("#ch").onclick=e=>{if(e.target.dataset.c){document.querySelectorAll("#ch .chip").forEach(c=>c.classList.remove("on"));e.target.classList.add("on");shop()}};$("#q").oninput=shop}
if(p=="resources"){arts();$("#rc").onclick=e=>{if(e.target.dataset.c){document.querySelectorAll("#rc .chip").forEach(c=>c.classList.remove("on"));e.target.classList.add("on");arts()}}}
if(p=="contact")$("#cf").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);location.href=WA+encodeURIComponent(`Hello HealthBridge, I’m ${d.get("n")} (${d.get("p")}). ${d.get("t")}: ${d.get("m")}`)}}
m.addEventListener("click",e=>{const t=e.target,dg=$("#dg");if(t.dataset.d){const rx=t.dataset.r=="1";dg.innerHTML=`<span class="badge ${rx?"rx":""}">${rx?"Prescription Required":"Non-Prescription"}</span><h2 style="font-size:1.8rem">${t.dataset.d}</h2><p style="color:var(--mut)">Brand, strength, pack size, price and storage: [Verified product information to be added]. Follow the product label or the directions provided by an authorised healthcare professional.</p><h4>Important Safety Information</h4><p style="color:var(--mut);font-size:.9rem">Check ingredients and warnings. Tell your healthcare professional about allergies and other medicines. Seek advice if pregnant, breastfeeding, or buying for a child. Keep medicines out of children’s reach. This page does not replace personalised medical advice.</p><a class="pill dk" href="${WA}${encodeURIComponent((rx?"Prescription enquiry: ":"Enquiry: ")+t.dataset.d)}">${rx?"Make a Prescription Enquiry":"Enquire About This Product"} <i>→</i></a> <button class="link" onclick="dg.close()" style="margin-left:14px">Close</button>`;dg.showModal()}
if(t.dataset.a){dg.innerHTML=`<h2 style="font-size:1.6rem">${t.dataset.a}</h2><p style="color:var(--mut)">Article content to be written and reviewed by a qualified healthcare professional before publication. When to seek help: contact a pharmacist, doctor, or other appropriate professional if symptoms are severe or concerning.</p><button class="link" onclick="dg.close()">Close</button>`;dg.showModal()}});
let ly=0;addEventListener("scroll",()=>{const y=scrollY;hd.classList.toggle("solid",y>60);hd.classList.toggle("hide",y>ly&&y>300);ly=y},{passive:true});
addEventListener("hashchange",route);route();
</script>
</body>
</html>
